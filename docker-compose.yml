services:
  toothless:
    build: .
    container_name: toothlessbait
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.toothless.rule=Host(`nsfw.7thseraph.org`)"
      - "traefik.http.services.toothless.loadbalancer.server.port=80"
      - "traefik.http.routers.toothless.tls.certresolver=letsencrypt"
      - "traefik.http.routers.toothless.entrypoints=https"
      - "traefik.http.routers.toothless.tls=true"

networks:
  proxy:
    external: true
